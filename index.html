<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ahmar Ali — Full Stack Engineer & ML Developer</title>
  <meta name="description" content="Portfolio of Syed Ahmar Ali — full stack engineer, open-source developer, and computer vision & ML student at FAST-NUCES. Founder of the OFR and OCR communities." />
  <meta name="theme-color" content="#080e1a" />
  <link rel="canonical" href="https://ahmar004.github.io/" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Ahmar Ali — Full Stack Engineer & ML Developer" />
  <meta property="og:description" content="Knock down the crates to explore my work. Full stack engineering, computer vision, and open-source communities with 2,500+ members." />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Syed Ahmar Ali",
    "alternateName": "Ahmar Ali",
    "jobTitle": "Full Stack Engineer",
    "email": "ahmarali2004@gmail.com",
    "url": "https://ahmar004.github.io/",
    "sameAs": ["https://github.com/Ahmar004", "https://linkedin.com/in/ahmarali2004/"],
    "address": { "@type": "PostalAddress", "addressLocality": "Islamabad", "addressCountry": "PK" },
    "alumniOf": { "@type": "CollegeOrUniversity", "name": "FAST — National University of Computer & Emerging Sciences" }
  }
  </script>
</head>

<body>
  <a class="skip-link" href="#content">Skip to portfolio content</a>

  <div class="page-progress" id="pageProgress" aria-hidden="true"></div>

  <!-- ─────────────── TOP BAR ─────────────── -->
  <nav class="topbar" id="topbar">
    <a href="#top" class="nav-brand"><em>Ahmar</em> Ali</a>
    <div class="nav-links" id="navLinks">
      <!-- section links injected from content.js -->
      <button class="icon-btn" id="hamburger" aria-label="Open menu" aria-expanded="false">☰</button>
      <button class="icon-btn theme-btn" id="themeBtn" aria-label="Toggle light and dark theme">🌙</button>
    </div>
  </nav>
  <div class="mobile-menu" id="mobileMenu"></div>

  <!-- ─────────────── PLAYFIELD ─────────────── -->
  <header class="playfield" id="top">
    <canvas id="scene" aria-hidden="true"></canvas>

    <!-- Static text layer: readable before three.js boots, and the whole
         story if WebGL never starts. -->
    <div class="playfield-overlay">
      <div class="intro" id="intro">
        <p class="intro-tag">Open to work · collaboration · open-source</p>
        <h1 class="intro-name">Ahmar Ali</h1>
        <p class="intro-role"><span id="typedRole"></span></p>
        <p class="intro-blurb" id="introBlurb"></p>
      </div>

      <div class="hud" id="hud" hidden>
        <div class="hud-hint" id="hudHint">
          <span class="hud-hint-icon">🎯</span>
          <span id="hudHintText">Drag back from the slingshot and release</span>
        </div>
        <div class="hud-progress">
          <span class="hud-count"><b id="hitCount">0</b> / <span id="totalCount">7</span></span>
          <span class="hud-label">crates knocked down</span>
        </div>
      </div>

      <div class="playfield-actions">
        <button class="ghost-btn" id="resetBtn" hidden>↻ Reset crates</button>
        <a class="ghost-btn" href="#content" id="skipBtn">Skip the game ↓</a>
      </div>

      <div class="scroll-cue" aria-hidden="true"><span></span></div>
    </div>

    <noscript>
      <div class="noscript-note">
        This portfolio has an interactive 3D playfield, but every word of it is
        readable without JavaScript — just scroll.
      </div>
    </noscript>
  </header>

  <!-- ─────────────── CONTENT ─────────────── -->
  <main class="wrap" id="content">
    <!-- sections injected from content.js -->
  </main>

  <footer class="site-footer">
    <p class="footer-note"><em>Thanks for visiting.</em> Built with three.js and cannon-es.</p>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
